name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Offline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type-Check
        run: npm run lint

      # NOTE: Provisioning the NudeNet model asset requires network access in CI.
      # The tests themselves remain offline and test against this provisioned local asset.
      # The expected SHA-256 checksum was computed from our local asset,
      # and is not published or independently authenticated by upstream.
      # Downloading in CI does not resolve model-weight licensing.
      # The applicable terms require verification before application distribution.
      - name: Provision NudeNet 320n Model Asset
        run: |
          mkdir -p public/models/nudenet
          TMP_FILE="public/models/nudenet/320n.onnx.tmp"
          TARGET_FILE="public/models/nudenet/320n.onnx"
          EXPECTED_SHA256="c15d8273adad2d0a92f014cc69ab2d6c311a06777a55545f2c4eb46f51911f0f"
          MODEL_URL="https://api.github.com/repos/notAI-tech/NudeNet/releases/assets/176831997"

          echo "Downloading NudeNet 320n model from official release..."
          curl -fL -sS --connect-timeout 30 --max-time 180 --retry 3 \
            -H "Accept: application/octet-stream" \
            -o "$TMP_FILE" \
            -w "HTTP code: %{http_code}\nContent-Type: %{content_type}\n" \
            "$MODEL_URL"

          echo "File size: $(stat -c %s "$TMP_FILE") bytes"
          file "$TMP_FILE"

          echo "Verifying model SHA-256 checksum..."
          CALCULATED_SHA256=$(sha256sum "$TMP_FILE" | awk '{print tolower($1)}')

          if [ "$CALCULATED_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: SHA-256 mismatch for 320n.onnx!"
            echo "Expected: $EXPECTED_SHA256"
            echo "Got:      $CALCULATED_SHA256"
            rm -f "$TMP_FILE"
            exit 1
          fi

          mv "$TMP_FILE" "$TARGET_FILE"
          echo "Verified and provisioned $TARGET_FILE successfully."

      # NOTE: tests/youtube.test.ts is excluded for now because startYouTubeDownload()
      # spawns a yt-dlp binary (local binary / network process) which is not guaranteed
      # on a standard headless Linux runner and is not purely offline.
      - name: Run Offline Unit Tests
        run: |
          node --import tsx --test --test-concurrency=1 \
            tests/formatters.test.ts \
            tests/modelPreprocessing.test.ts \
            tests/accuracyAndDiagnostics.test.ts \
            tests/detectionPipelineRegression.test.ts \
            tests/geminiService.test.ts \
            tests/geminiFileLifecycle.test.ts
